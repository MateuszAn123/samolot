<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Cesium Samolot - Przyspieszenie i Zwalnianie</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
        #cesiumContainer { width: 100vw; height: 100vh; }
        #telemetry {
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.85);
            color: #00ff00; font-family: monospace; padding: 15px; font-size: 14px;
            pointer-events: none; border: 1px solid #00ff00; border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <div id="telemetry">Inicjalizacja lotu...</div>

    <script>
        fetch('config.json?v=' + new Date().getTime())
            .then(response => response.json())
            .then(config => {
                
                Cesium.Ion.defaultAccessToken = config.cesiumIonToken;

                const viewer = new Cesium.Viewer('cesiumContainer', {
                    infoBox: false, selectionIndicator: false, shouldAnimate: true,
                    terrain: Cesium.Terrain.fromWorldTerrain(), baseLayerPicker: false
                });

                viewer.scene.screenSpaceCameraController.enableInputs = true;
                viewer.scene.screenSpaceCameraController.minimumZoomDistance = 10;

                const f = config.flight;

                // 1. OBLICZANIE KIERUNKU I ODLEGŁOŚCI
                const start2D = Cesium.Cartesian3.fromDegrees(f.startLongitude, f.startLatitude, 0);
                const end2D = Cesium.Cartesian3.fromDegrees(f.endLongitude, f.endLatitude, 0);
                const totalDistance = Cesium.Cartesian3.distance(start2D, end2D);

                const lonDiff = Cesium.Math.toRadians(f.endLongitude - f.startLongitude);
                const lat1 = Cesium.Math.toRadians(f.startLatitude);
                const lat2 = Cesium.Math.toRadians(f.endLatitude);
                const y = Math.sin(lonDiff) * Math.cos(lat2);
                const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(lonDiff);
                const flightHeading = Math.atan2(y, x); 

                let currentLon = f.startLongitude;
                let currentLat = f.startLatitude;
                let currentAlt = f.startAltitude;

                let currentPosition = Cesium.Cartesian3.fromDegrees(currentLon, currentLat, currentAlt);
                const modelHeadingOffset = Cesium.Math.toRadians(-90); 
                let currentOrientation = Cesium.Transforms.headingPitchRollQuaternion(
                    currentPosition, new Cesium.HeadingPitchRoll(flightHeading + modelHeadingOffset, 0, 0)
                );

                const airplaneEntity = viewer.entities.add({
                    position: new Cesium.CallbackProperty(() => currentPosition, false),
                    orientation: new Cesium.CallbackProperty(() => currentOrientation, false),
                    model: {
                        uri: config.vehicle.modelUri,
                        scale: config.vehicle.scale,
                        minimumPixelSize: 64
                    }
                });

                viewer.trackedEntity = airplaneEntity;

                // --- 2. GŁÓWNA PĘTLA CZASOWA (Z nową kinematyką) ---
                let lastTime = viewer.clock.currentTime;
                let elapsedTime = 0;
                const totalDuration = f.durationSeconds;
                const telemetryDiv = document.getElementById('telemetry');

                viewer.scene.preUpdate.addEventListener(function(scene, time) {
                    const dt = Cesium.JulianDate.secondsDifference(time, lastTime);
                    lastTime = time.clone();

                    if (dt <= 0 || dt > 0.5) return; 

                    elapsedTime += dt;
                    
                    // timeRatio to upływ czasu (od 0.0 do 1.0)
                    let timeRatio = elapsedTime / totalDuration;
                    if (timeRatio > 1.0) timeRatio = 1.0; 

                    let progress = 0; // Przebieg trasy od 0.0 do 1.0
                    let currentSpeedMs = 0; // Prędkość w metrach na sekundę
                    let speedPhase = "";

                    // FIZYKA KINEMATYCZNA: Ruch jednostajnie przyspieszony i opóźniony
                    if (timeRatio <= 0.5) {
                        // PRZYSPIESZANIE (od 0% do 50% czasu trwania)
                        speedPhase = "PRZYSPIESZANIE";
                        // Wzór na drogę w ruchu przyspieszonym: s = a*t^2 (tutaj a=2 w skali progresu)
                        progress = 2 * (timeRatio * timeRatio);
                        // Prędkość rośnie liniowo
                        currentSpeedMs = (4 * totalDistance / totalDuration) * timeRatio;
                    } else {
                        // ZWALNIANIE (od 50% do 100% czasu trwania)
                        speedPhase = "ZWALNIANIE";
                        // Wzór na drogę w ruchu opóźnionym z odwróconą parabolą
                        progress = 4 * timeRatio - 2 * (timeRatio * timeRatio) - 1;
                        // Prędkość maleje liniowo
                        currentSpeedMs = (4 * totalDistance / totalDuration) * (1 - timeRatio);
                    }

                    // Zabezpieczenie przed przekroczeniem 100% drogi
                    if (progress > 1.0) {
                        progress = 1.0;
                        currentSpeedMs = 0;
                        speedPhase = "ZATRZYMANY";
                    }

                    // Dynamiczne czytanie poziomu gruntu
                    const startGround = viewer.scene.globe.getHeight(Cesium.Cartographic.fromDegrees(f.startLongitude, f.startLatitude)) || f.startAltitude;
                    const endGround = viewer.scene.globe.getHeight(Cesium.Cartographic.fromDegrees(f.endLongitude, f.endLatitude)) || f.endAltitude;
                    const peakAltitude = Math.max(startGround, endGround) + f.cruiseAltitude;

                    // Przesuwanie na mapie na podstawie naszego krzywoliniowego postępu drogi
                    currentLon = f.startLongitude + (f.endLongitude - f.startLongitude) * progress;
                    currentLat = f.startLatitude + (f.endLatitude - f.startLatitude) * progress;

                    let flightPhase = "";

                    // Profilowanie wysokości (idealny trójkąt sprzężony z dystansem)
                    if (progress < 0.5) {
                        flightPhase = "WZNOSZENIE (↑)";
                        let p = progress / 0.5; 
                        currentAlt = startGround + p * (peakAltitude - startGround);
                    } else if (progress < 1.0) {
                        flightPhase = "OPADANIE (↓)";
                        let p = (progress - 0.5) / 0.5; 
                        currentAlt = peakAltitude - p * (peakAltitude - endGround);
                    } else {
                        flightPhase = "WYLĄDOWAŁ";
                        currentAlt = endGround; 
                    }

                    // Przeliczanie parametrów do wizualizacji
                    const remainingDistance = totalDistance * (1.0 - progress);
                    const speedKmh = currentSpeedMs * 3.6;

                    currentPosition = Cesium.Cartesian3.fromDegrees(currentLon, currentLat, currentAlt);
                    
                    // Zawsze poziomo (Pitch = 0)
                    currentOrientation = Cesium.Transforms.headingPitchRollQuaternion(
                        currentPosition,
                        new Cesium.HeadingPitchRoll(flightHeading + modelHeadingOffset, 0, 0)
                    );

                    // Aktualizacja panelu
                    telemetryDiv.innerHTML = `
                        STAN SILNIKA: <span style="color: cyan; font-weight: bold;">${speedPhase}</span><br>
                        FAZA LOTU: <span style="color: white; font-weight: bold;">${flightPhase}</span><br>
                        CZAS: ${(timeRatio * 100).toFixed(1)} % (${elapsedTime.toFixed(0)}s / ${totalDuration}s)<br>
                        DO CELU: <span style="color: yellow; font-size: 1.1em; font-weight: bold;">${remainingDistance.toFixed(0)} m</span><br>
                        -------------------------<br>
                        PRĘDKOŚĆ: ${speedKmh.toFixed(0)} km/h<br>
                        WYSOKOŚĆ: ${currentAlt.toFixed(0)} m (npm)<br>
                    `;
                });
            })
            .catch(error => console.error('Błąd config.json:', error));
    </script>
</body>
</html>
